name: Update daily market brief
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public market headlines
        run: python scripts/update_daily_brief.py
      - name: Commit if changed
        run: |
          git config user.name "asset-note-bot"
          git config user.email "asset-note-bot@users.noreply.github.com"
          git add data/daily-brief.json
          git diff --cached --quiet || git commit -m "Daily market brief"
          git push
